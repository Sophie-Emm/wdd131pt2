<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="styles.css">


    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                
</head>
<body>
    <header class = "site-header">
        <nav>
            <img src="images/recipebook.png" alt="Recipe Book Logo">
            <h1>Recipe Book</h1>
        </nav>
        <form class="search">
            <label for="search">Search recipes</label>
            <input type="search" id="search" name="search" />
            <button type="submit">
                <img src="images/search.png" alt="Search" />
            </button>
        </form>
    </header>
    <main>
        <article class="recipe-card">
            <img src="images/applecrisp.png" alt="Apple Crisp" />
            <h2>Apple Crisp</h2>
            <p>this apple crisp recipe is the best!</p>

            <span
                class="rating"
                role="img"
                aria-label="Rating: 4 out of 5 stars"
                >
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star">⭐</span>
                <span aria-hidden="true" class="icon-star-empty">☆</span>
            </span>
       
        </article>
    </main>
    <footer>

        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.png" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.png" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.png" alt="pinterest icon"></a>
        </div>  
        <p>
            <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons"> 
                Recipe icons created by Freepik - Flaticon
            </a>
        </p>                
                
    </footer>
    
</body>
</html>
