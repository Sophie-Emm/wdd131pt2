<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <img src="character.png" alt="" id="image">
    <div class="name" id="name"></div>
    <div class="cls"  id="cls"></div>

    <div class="stats">
      <div>
        <div class="stat-value" id="lvl"></div>
        <div class="stat-label">Level</div>
      </div>
      <div>
        <div class="stat-value" id="hp"></div>
        <div class="stat-label">Health</div>
      </div>
    </div>

    <div class="hp-label">HP</div>
    <div class="hp-track">
      <div class="hp-bar" id="bar"></div>
    </div>

    <div class="buttons">
      <button class="btn-atk" id="btnA" onclick="handleAttack()">⚔️ Attacked</button>
      <button class="btn-lvl" id="btnL" onclick="handleLevel()">⬆️ Level Up</button>
    </div>

    <div class="log" id="log">Awaiting battle...</div>
  </div>

  <script src="character.js"></script>
</body>
</html>
